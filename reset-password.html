<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password | SkinSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <p class="script">Almost there</p>
            <h1>Choose a new password.</h1>
            <p>
                Enter a new password for your SkinSense account.
            </p>
            <label for="new-password">New password</label>
            <input id="new-password" type="password" placeholder="New password">
            <button class="dark-button" onclick="updatePassword()">
                Update Password
            </button>
            <p id="update-password-message"></p>
            <a href="login.html">
                Return to login
            </a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
