<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SkinSense</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Reset your password.</h1>

            <p>
                Enter your email and Supabase will send you a reset link.
            </p>

            <label for="reset-email">Email</label>
            <input id="reset-email" type="email" placeholder="Your email">

            <button class="dark-button" onclick="sendPasswordReset()">
                Send Reset Link
            </button>

            <p id="reset-message"></p>

            <a href="login.html">
                Return to login
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
